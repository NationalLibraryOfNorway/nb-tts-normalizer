name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check installed CLI
        working-directory: ${{ runner.temp }}
        run: |
          nb-tn --strict 'v1.2.3 og 75 m2, 5 MW og NRK P1+'
          nb-tn --strict --currency-locale en-US '$12.50 og ¥100'
          nb-tn --strict '3,14 og 1,75'
          nb-tn --strict --decimal-style digits '3,14 og 1,75'
          nb-tn --strict --language nn 'NOK 1,01 og 2 kWh, jf. §§ 1–3 den 8. mai 2026'
          nb-tn --strict --language nn --decimal-style digits '3,21'
          nb-tn --strict '9,81m/s2'
          nb-tn --strict --language nn '9,81m/s2'
          nb-tn --strict '2 J/(kg K), 120 mmHg og 30°15′20″'
          nb-tn --strict --language nn '2 J/(kg K), 120 mmHg og 30°15′20″'
          python -m nb_tn.provenance
          python -c "from importlib.metadata import files; assert any(str(p).endswith('LICENSES/Unicode-3.0.txt') for p in files('nb-tts-normalizer'))"
